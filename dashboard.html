<script>/* Blue Bayou sync: one place every page reads and writes.
   Always keeps a copy in this browser (works anywhere, syncs between tabs).
   When the page runs inside claude.ai with the shared database granted, every
   change also goes to the database and comes back live on every other device. */
window.BB = (function () {
  var K = { data: "bb-data-v1", orders: "bb-orders-v1", reqs: "bb-requests-v1" };
  function get(k, f) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var subs = [], db = null, live = false, liveCbs = [];
  function on(fn) { subs.push(fn); }
  function emit(key, remote) { subs.forEach(function (fn) { try { fn(key, remote); } catch (e) { console.error(e); } }); }
  function onLive(fn) { if (live) fn(); else liveCbs.push(fn); }
  // one write at a time per document
  var q = {};
  function write(path, fn) { var p = (q[path] || Promise.resolve()).then(fn).catch(function (e) { console.warn("[bb sync]", path, e && e.code); }); q[path] = p; return p; }
  function upsert(list, item) { var i = -1; list.forEach(function (x, j) { if (x.id === item.id) i = j; }); if (i < 0) list.push(item); else list[i] = item; return list; }
  var api = {
    K: K, get: get, on: on, onLive: onLive,
    isLive: function () { return live; },
    setData: function (D) {
      put(K.data, D); emit(K.data, false);
      if (db) write("bb/data", function () { return db.doc("bb/data").set({ json: JSON.stringify(D), at: Date.now() }); });
    },
    putOrder: function (o) {
      put(K.orders, upsert(get(K.orders, []), o)); emit(K.orders, false);
      if (db) write("orders/" + o.id, function () { return db.collection("orders").doc(o.id).set(o); });
    },
    delOrder: function (id) {
      put(K.orders, get(K.orders, []).filter(function (o) { return o.id !== id; })); emit(K.orders, false);
      if (db) write("orders/" + id, function () { return db.collection("orders").doc(id).delete(); });
    },
    putReq: function (r) {
      put(K.reqs, upsert(get(K.reqs, []), r)); emit(K.reqs, false);
      if (db) write("requests/" + r.id, function () { return db.collection("requests").doc(r.id).set(r); });
    },
    delReq: function (id) {
      put(K.reqs, get(K.reqs, []).filter(function (r) { return r.id !== id; })); emit(K.reqs, false);
      if (db) write("requests/" + id, function () { return db.collection("requests").doc(id).delete(); });
    },
    seedLocal: function (key, val) { if (!live && get(key, null) === null) put(key, val); }
  };
  // other tabs in this browser
  window.addEventListener("storage", function (e) { if (e.key === K.data || e.key === K.orders || e.key === K.reqs) emit(e.key, true); });
  // the shared database, when this view has it
  (function () {
    if (!window.claude || typeof window.claude.use !== "function") return;
    window.claude.use("db").then(function (d) {
      if (!d) return;
      db = d;
      var first = { data: true, orders: true, reqs: true };
      function goLive() { if (live) return; live = true; liveCbs.splice(0).forEach(function (fn) { try { fn(); } catch (e) {} }); }
      db.doc("bb/data").onSnapshot(function (s) {
        if (s.exists) {
          var j = s.data().json, cur = JSON.stringify(get(K.data, null));
          if (j && j !== cur) { try { put(K.data, JSON.parse(j)); emit(K.data, true); } catch (e) {} }
        }
        if (!s.metadata.fromCache && first.data) { first.data = false; goLive(); }
      }, function (e) { console.warn("[bb sync] data", e.code); });
      function coll(name, key, flag) {
        db.collection(name).onSnapshot(function (qs) {
          if (qs.metadata.fromCache && first[flag]) return;
          first[flag] = false;
          var rows = qs.docs.map(function (x) { return x.data(); });
          if (JSON.stringify(rows) !== JSON.stringify(get(key, []))) { put(key, rows); emit(key, true); }
          goLive();
        }, function (e) { console.warn("[bb sync] " + name, e.code); });
      }
      coll("orders", K.orders, "orders"); coll("requests", K.reqs, "reqs");
    });
  })();
  return api;
})();
</script>

/* Blue Bayou owner dashboard. Same navy, gold and ivory as the website, set for daylight use on a phone or a tablet at the host stand. */

          '<div class="tog"><span>' + (on ? "On the menu and on the website" : "Switched off, hidden from the website") + '</span><button class="switch" type="button" role="switch" aria-checked="' + on + '" data-sw="' + path + '"><span class="sw"></span>' + (on ? "On" : "Off") + "</button></div></div>";
      }).join("") + "</div>";
    }).join("") || '<div class="empty"><b>No dish called that</b>Try another word, or add it as a new dish.</div>';
    renderSide();
  }
  function at(path) { var p = path.split("."); return D.menu[p[0]][+p[1]].items[+p[2]]; }
  var ME = R.getElementById("s-menu");
  ME.addEventListener("click", function (e) {
    var c = e.target.closest("[data-c]"), sw = e.target.closest("[data-sw]"), ed = e.target.closest("[data-ed]");
    if (c) { CAT = c.dataset.c; renderMenuEd(); stagger(R.querySelectorAll("#dishes .mgroup h3, #dishes .dish")); }
    if (sw) {
      var it = at(sw.dataset.sw); it.on = it.on === false; saveData(it.on ? "<b>" + esc(it.n) + "</b> is back on your website." : "<b>" + esc(it.n) + "</b> is switched off. Guests can't order it.");
      var box = sw.closest(".dish"); box.classList.toggle("off", !it.on); sw.setAttribute("aria-checked", String(it.on)); sw.lastChild.textContent = it.on ? "On" : "Off";
      box.querySelector(".tog span").textContent = it.on ? "On the menu and on the website" : "Switched off, hidden from the website"; renderSide();
    }
    if (ed) {
      var box = ed.closest(".dish"), it2 = at(ed.dataset.ed); if (box.querySelector(".dedit")) return;
      var f = document.createElement("div"); f.className = "dedit";
      f.innerHTML = '<div class="fld"><label>Name</label><input value="' + esc(it2.n) + '" data-f="n"></div><div class="fld"><label>Description</label><textarea data-f="d">' + esc(it2.d || "") + '</textarea></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm" type="button" data-save="' + ed.dataset.ed + '">Save</button><button class="btn sm soft" type="button" data-cancel>Cancel</button><button class="btn sm soft" type="button" data-rm="' + ed.dataset.ed + '" style="margin-left:auto;color:var(--late)">Delete dish</button></div>';
      box.appendChild(f); f.querySelector("input").focus({ preventScroll: true });
    }
    var sv = e.target.closest("[data-save]"), cn = e.target.closest("[data-cancel]"), rm = e.target.closest("[data-rm]");
    if (sv) { var it3 = at(sv.dataset.save), bx = sv.closest(".dish"); var nm = bx.querySelector('[data-f="n"]').value.trim(); if (nm) it3.n = nm; it3.d = bx.querySelector('[data-f="d"]').value.trim(); saveData(); renderMenuEd(); }
    if (cn) renderMenuEd();
    if (rm) { var p = rm.dataset.rm.split("."), gone = D.menu[p[0]][+p[1]].items.splice(+p[2], 1)[0]; saveData("<b>" + esc(gone.n) + "</b> deleted from your menu."); renderMenuEd(); }
    if (e.target.id === "addDish") addForm();
  });
  ME.addEventListener("change", function (e) {
    var el = e.target; if (!el.dataset.pp) return;
    var it = at(el.dataset.pp), v = Math.round(parseFloat(String(el.value).replace(/[^0-9.]/g, "")) * 100) / 100;
    if (!(v >= 0)) { toast("Please type a price, like 18 or 18.50"); renderMenuEd(); return; }
    var o = +el.dataset.o; if (o < 0) it.p = v; else it.p[o][1] = v;
    // dishes listed twice (breakfast and dinner) keep the same price
    allGroups().forEach(function (g) { g.gr.items.forEach(function (x) { if (x !== it && x.n === it.n && x.p != null && typeof x.p === typeof it.p) x.p = JSON.parse(JSON.stringify(it.p)); }); });
    el.value = v; saveData("<b>" + esc(it.n) + "</b> is now " + (o < 0 ? money(v) : money(v) + " for " + esc(it.p[o][0].toLowerCase())) + " on your website.");
  });
  R.getElementById("srch").addEventListener("input", function (e) { Q = e.target.value; renderMenuEd(); });
  function addForm() {
    if (R.getElementById("addf")) return;
    var gs = allGroups(), f = document.createElement("form"); f.className = "addform"; f.id = "addf";
    f.innerHTML = '<h3 style="font-size:1.3rem">New dish</h3><div class="row2"><div class="fld"><label for="nf-n">Name</label><input id="nf-n" required placeholder="Shrimp Creole"></div><div class="fld"><label for="nf-g">Section</label><select id="nf-g">' + gs.map(function (g) { return '<option value="' + g.k + "." + g.gi + '">' + esc(g.gr.h) + " (" + SECT[g.k] + ")</option>"; }).join("") + '</select></div></div><div class="fld"><label for="nf-d">Description</label><input id="nf-d" placeholder="What is it, in a few words"></div><div class="row2"><div class="fld"><label for="nf-p">Price</label><input id="nf-p" inputmode="decimal" placeholder="24"></div><div class="fld"><span class="lab">Online ordering</span><p class="help" style="margin:0">Dishes with a price can be ordered for pickup. Leave the price empty for drinks.</p></div></div><div style="display:flex;gap:10px"><button class="btn gold" type="submit">Add to the menu</button><button class="btn soft" type="button" id="nf-x">Cancel</button></div>';
    R.getElementById("dishes").prepend(f); R.getElementById("nf-n").focus();
    f.addEventListener("submit", function (e) {
      e.preventDefault(); var n = R.getElementById("nf-n").value.trim(); if (!n) return;
      var g = R.getElementById("nf-g").value.split("."), pv = parseFloat(R.getElementById("nf-p").value);
      var it = { n: n, d: R.getElementById("nf-d").value.trim(), on: true }; if (pv >= 0) it.p = Math.round(pv * 100) / 100;
      D.menu[g[0]][+g[1]].items.push(it); saveData("<b>" + esc(n) + "</b> is on your website."); CAT = g[0] + g[1]; renderMenuEd();
    });
    R.getElementById("nf-x").addEventListener("click", function () { f.remove(); });
  }

  /* ---------- website: hours & details ---------- */
  var OT = []; for (var a = 300; a <= 840; a += 30) OT.push(a);
  var CT = []; for (var c2 = 1080; c2 <= 1440 + 360; c2 += 30) CT.push(c2);
  function opt(list, sel) { return list.map(function (m) { return '<option value="' + m + '"' + (m === sel ? " selected" : "") + ">" + fmt(m) + "</option>"; }).join(""); }
  function renderWords() {
    var s = D.site;
    R.getElementById("w-ann").value = s.announce || ""; R.getElementById("w-ph").value = s.phone || "";
    R.getElementById("w-tag").value = s.tagline || ""; R.getElementById("w-mus").value = s.musicNote || "";
    R.getElementById("hrs").innerHTML = [1, 2, 3, 4, 5, 6, 0].map(function (d) { var h = D.hours[d]; return '<div class="hr"><b style="font-weight:500">' + DAYS[d] + '</b><select data-h="' + d + '" data-k="0" aria-label="' + DAYS[d] + ' opens">' + opt(OT, h[0]) + '</select><span>to</span><select data-h="' + d + '" data-k="1" aria-label="' + DAYS[d] + ' closes">' + opt(CT, h[1]) + "</select></div>"; }).join("");
  }
  R.getElementById("words").addEventListener("submit", function (e) {
    e.preventDefault();
    var ph = R.getElementById("w-ph").value.trim(), dg = ph.replace(/\D/g, "");
    if (dg.length < 10) { toast("That phone number looks short. Please check it."); return; }
    D.site.announce = R.getElementById("w-ann").value.trim(); D.site.phone = ph;
    D.site.tagline = R.getElementById("w-tag").value.trim() || DEF.site.tagline; D.site.musicNote = R.getElementById("w-mus").value.trim();
    R.querySelectorAll("[data-h]").forEach(function (s) { D.hours[s.dataset.h][+s.dataset.k] = +s.value; });
    saveData();
  });
  R.querySelectorAll(".seg button").forEach(function (b) { b.addEventListener("click", function () { R.querySelectorAll(".seg button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); R.getElementById("s-menu").hidden = b.dataset.s !== "menu"; R.getElementById("s-words").hidden = b.dataset.s !== "words"; segPlace(true); var sh = R.getElementById(b.dataset.s === "menu" ? "s-menu" : "s-words"); anim(sh, [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 480 }); }); });

  /* ---------- live sync with the website and other devices ---------- */
  BB.on(function (key, remote) {
    if (key === "bb-orders-v1") {
      var before = seen, now2 = {}, fresh = {}, added = false;
      orders().forEach(function (o) { now2[o.id] = 1; if (!before[o.id] && !o.sample) { fresh[o.id] = 1; added = true; } });
      seen = now2; renderOrders(fresh);
      if (added && remote) { beep(); toast("<b>New pickup order</b> from your website."); }
    }
    if (key === "bb-requests-v1") { var nb = reqs().filter(function (r) { return r.status === "new" && !r.sample; }).length; renderReqs(); if (remote && nb > (renderReqs.nb || 0)) { toast("<b>New request</b> from your website."); beep(); } renderReqs.nb = nb; }
    if (key === "bb-data-v1" && remote) {
      var nd = loadData(); if (JSON.stringify(nd) === JSON.stringify(D)) return;
      var ae = R.activeElement; if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) { D = nd; paintTaking(); renderLive(); return; }
      D = nd; paintTaking(); renderMusic(); renderMenuEd(); renderWords(); toast("Updated from another device.");
    }
  });
  BB.onLive(function () { R.getElementById("syncNote").hidden = false; });
  // only the restaurant (owner or editors) runs the dashboard inside claude.ai
  if (window.claude && window.claude.use) window.claude.use("user").then(function (u) { if (!u) return; return u.canEdit().then(function (ok) { if (!ok) R.getElementById("locked").hidden = false; }); }).catch(function () {});

  tabPlace = indicator(R.querySelector(".tabs"), '[aria-selected="true"]');
  var segPlace = indicator(R.querySelector(".seg"), '[aria-pressed="true"]'), filPlace = indicator(R.querySelector(".filters"), '[aria-pressed="true"]');
  orders().forEach(function (o) { seen[o.id] = 1; });
  tick(); paintTaking(); renderOrders(); renderReqs(); renderMusic(); renderMenuEd(); renderWords(); showTab(TAB, true);
  setInterval(function () { tick(); renderOrders(); renderLive(); }, 30000);
};
</script>
<script>
window.mountDash = function () { var host = document.getElementById("dash"); if (!host || host.shadowRoot) return; var R = host.attachShadow({ mode: "open" }); R.appendChild(document.getElementById("dashTpl").content.cloneNode(true)); window.BBDash(R); };
</script>
<script>mountDash();</script>
